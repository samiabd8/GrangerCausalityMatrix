[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grangercm"
version = "0.1.0"
description = "Granger Causality Matrices and heatmaps for multivariate time series"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["granger causality", "time series", "econometrics", "heatmap", "VAR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4", "seaborn>=0.11"]
nonlinear = ["scikit-learn>=1.0"]
dev = [
    "pytest>=7",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/yourname/grangercm"
Issues = "https://github.com/yourname/grangercm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
